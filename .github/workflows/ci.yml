# =============================================================================
# CI Pipeline — Runs on every Pull Request to main and dev
# =============================================================================
# Purpose: Catch lint errors, type errors, and build failures BEFORE merging.
# This is your automated code quality gate.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main, dev]
  # Also run on direct pushes to main/dev (as a safety net)
  push:
    branches: [main, dev]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 4. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Generate Prisma Client
      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      # 6. Run ESLint
      # TODO: Remove continue-on-error once pre-existing lint debt is resolved.
      - name: Lint
        continue-on-error: true
        run: pnpm lint

      # 7. Build the project (catches TypeScript errors + Next.js issues)
      - name: Build
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ZGVlcC1mbG91bmRlci01OTAyLmNsZXJrLmFjY291bnRzLmRldiQ"
          CLERK_SECRET_KEY: "sk_test_j9858FOF97I5KBCnIN8uK3mqV0cww2zZJFO5CAOJ9f"
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/login"
          NEXT_PUBLIC_CLERK_SIGN_OUT_URL: "/login"
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
          ADMIN_EMAIL: "ci@placeholder.com"
          CRON_SECRET: "ci-placeholder"
        run: pnpm build
